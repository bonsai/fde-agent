version: 0.3
kind: fde-mission
name: field-first-problem-solving
principle: 野に降り、問題を見出し、解法を設計し、実装し、運用し、改善・再構成する
phases:
  - observe
  - issue
  - model-solution
  - implement
  - operate
  - improve-reconfigure
phase_files:
  observe: mission-observe.yaml
  issue: mission-issue.yaml
  model-solution: mission-model-solution.yaml
  implement: mission-implement.yaml
  operate: mission-operate.yaml
  improve-reconfigure: mission-improve-reconfigure.yaml
flow: "WORLD → OBSERVE → ISSUE → MODEL+SOLUTION → IMPLEMENT → OPERATE → IMPROVE/RECONFIGURE → OBSERVE"
loop: true
