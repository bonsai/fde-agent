version: 0.1
kind: fde-mission-phase
phase: mobilize
name: agent-mobilization
mission: Issueに必要な問題解決主体を呼び、Toolを借りて実行し、結果を世界へ返す
principles:
  - agent_is_problem_solver
  - capability_is_not_tool
  - tool_is_borrowed
  - action_requires_authority
  - result_requires_verification
inputs:
  - issue
  - world_model
  - work_candidates
  - constraints
activities:
  - identify_required_capability
  - find_agent
  - authorize_agent
  - select_tools
  - instantiate_task
  - execute_action
  - verify_result
  - preserve_evidence
outputs:
  - agent
  - task
  - tool_usage
  - action
  - result
  - evidence
  - state_update
exit_condition: "Issueの状態が検証可能な結果によって更新される"
next: observe
